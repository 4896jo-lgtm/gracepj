<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>做一顆蛋糕，測出你的職場人格</title>
<style>
  :root{
    --ink:#3A2E24;
    --muted:#8A7A68;
    --muted-soft:#B5A48D;
    --card:#FFFDF9;
    --line:#EDE3D3;
    --btn:#FBF7EF;
    --accent:#C89968;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system, "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background:linear-gradient(160deg, #FBF3EC 0%, #F5E4D8 55%, #F0DCE0 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    color:var(--ink);
  }
  .panel{
    width:100%;
    max-width:440px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 8px 30px rgba(107,91,79,0.12);
    padding:32px 28px;
  }
  .screen{ animation:fade .4s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* intro */
  .center{ text-align:center; }
  .intro-emoji{ font-size:56px; margin-bottom:8px; }
  h1.title{ font-size:23px; font-weight:700; margin:0 0 10px; line-height:1.5; }
  p.subtitle{ color:var(--muted); font-size:14px; line-height:1.8; margin:0 0 20px; }
  .legend{ font-size:12px; color:var(--muted-soft); line-height:2.1; margin-bottom:26px; }
  .btn-main{
    background:var(--accent); color:#FFFDF9; border:none; border-radius:999px;
    padding:13px 34px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .btn-main:active{ transform:scale(.97); }
  .btn-main:focus-visible{ outline:3px solid #EAD9C2; outline-offset:3px; }

  /* cake layers preview */
  .cake-wrap{ display:flex; justify-content:center; margin-bottom:14px; }
  .cake{ display:flex; flex-direction:column-reverse; align-items:center; min-height:150px; justify-content:flex-end; }
  .plate{ width:150px; height:10px; border-radius:50%; background:#D9CFC0; margin-top:4px; }
  .layer{ height:16px; border-radius:6px; margin-bottom:-2px; box-shadow:inset 0 -4px 0 rgba(0,0,0,0.08); transition:all .4s ease; }

  /* question */
  .step-count{ font-size:12px; color:var(--muted-soft); text-align:center; margin-bottom:4px; }
  h2.qtitle{ font-size:19px; font-weight:700; text-align:center; margin:0 0 4px; }
  p.qsubtitle{ font-size:13px; color:var(--muted); text-align:center; margin:0 0 20px; }
  .option{
    display:block; width:100%; text-align:left; background:var(--btn);
    border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    margin-bottom:12px; cursor:pointer; font-family:inherit;
  }
  .option:active{ transform:scale(.98); }
  .option:hover{ border-color:var(--accent); }
  .option:focus-visible{ outline:3px solid #EAD9C2; outline-offset:2px; }
  .opt-title{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .opt-desc{ font-size:12.5px; color:#9A8C77; margin-top:3px; line-height:1.5; }

  /* result */
  .result-tag{ font-size:12px; color:var(--muted-soft); margin-bottom:10px; }
  .badge{
    width:150px; height:150px; border-radius:50%; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center; font-size:76px;
    box-shadow:0 18px 34px -10px rgba(58,46,36,0.4);
    animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ 0%{ transform:scale(.4) rotate(-8deg); opacity:0;} 100%{ transform:scale(1) rotate(0); opacity:1;} }
  h2.rtitle{ font-size:23px; font-weight:700; margin:0 0 2px; }
  .rsubtitle{ font-size:12.5px; color:var(--muted-soft); margin-bottom:16px; }
  .rdesc{
    font-size:13.5px; line-height:1.85; text-align:left; background:var(--btn);
    border-radius:14px; padding:14px 16px; margin-bottom:18px;
  }
  .block{ text-align:left; margin-bottom:14px; }
  .block-title{ font-size:12.5px; font-weight:700; margin-bottom:6px; }
  ul.strengths{ margin:0; padding-left:18px; font-size:13px; line-height:1.9; }
  .watch-box{ background:#F3E9DA; border-radius:12px; padding:10px 14px; }
  .watch-text{ font-size:12.5px; line-height:1.7; color:#5C4E3F; }
  .roles-text{ font-size:12.5px; color:#5C4E3F; }
  .radar-wrap{ display:flex; justify-content:center; margin-bottom:6px; }
  .compat-box{ background:#EFF5EC; border-radius:12px; padding:10px 14px; }
  .compat-text{ font-size:12.5px; line-height:1.7; color:#3E4A38; }
  .btn-outline{
    background:transparent; border:1.5px solid var(--accent); color:var(--accent);
    border-radius:999px; padding:10px 28px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-outline:focus-visible{ outline:3px solid #EAD9C2; outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>

const TRAIT_LABELS = ["穩定度","創意力","社交力","執行力","抗壓性","細膩度"];

function radarSVG(traits, colorMain){
  const cx=110, cy=104, radius=76;
  const n = TRAIT_LABELS.length;
  const angleStep = (Math.PI*2)/n;
  const pointAt = (i, r) => {
    const angle = -Math.PI/2 + i*angleStep;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  };
  let grid = '';
  for(let ring=1; ring<=4; ring++){
    const r = radius*(ring/4);
    const pts = TRAIT_LABELS.map((_,i)=> pointAt(i,r).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#E7DCC9" stroke-width="1"/>`;
  }
  const axisLines = TRAIT_LABELS.map((_,i)=>{
    const [x,y] = pointAt(i, radius);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E7DCC9" stroke-width="1"/>`;
  }).join('');
  const dataPts = traits.map((v,i)=> pointAt(i, radius*(v/5)).join(',')).join(' ');
  const labels = TRAIT_LABELS.map((label,i)=>{
    const [x,y] = pointAt(i, radius+20);
    return `<text x="${x}" y="${y}" font-size="11" fill="#5C4E3F" text-anchor="middle" dominant-baseline="middle">${label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 220 210" width="220" height="210">
    ${grid}${axisLines}
    <polygon points="${dataPts}" fill="${colorMain}55" stroke="${colorMain}" stroke-width="2"/>
    ${labels}
  </svg>`;
}

function initScores(){
  return { steady:0, creative:0, crisis:0, social:0, support:0, detail:0, integrate:0, strategist:0 };
}
function getResultKey(scores){
  let best="steady", bestScore=-1;
  for(const k of Object.keys(scores)){ if(scores[k]>bestScore){ bestScore=scores[k]; best=k; } }
  return best;
}

      <p class="subtitle">從基底、配料到裝飾，每一個選擇都藏著你面對工作的真實習慣。<br>8 個步驟，8 種人格，看看你做出來的是哪一種人。</p>
      <div class="legend">
        🍰 穩紮穩打　🍫 戰略布局　🧁 創意實驗　🎂 危機處理<br>
        🍩 團隊發光　🍞 默默支援　🍮 細節控制　🥐 資源整合
      </div>
      <button class="btn-main" id="startBtn">開始做蛋糕</button>
    </div>`;
  document.getElementById('startBtn').onclick = () => { stepIndex = 0; renderQuestion(); };
}

function renderQuestion(){
  const s = STEPS[stepIndex];
  panel.innerHTML = `
    <div class="screen">
      ${cakeHTML()}
      <div class="step-count">步驟 ${stepIndex+1} / ${STEPS.length}</div>
      <h2 class="qtitle">${s.title}</h2>
      <p class="qsubtitle">${s.subtitle}</p>
      <div id="opts"></div>
    </div>`;
  const opts = document.getElementById('opts');
  s.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<div class="opt-title">${opt.text}</div><div class="opt-desc">${opt.desc}</div>`;
    btn.onclick = () => handleChoice(opt);
    opts.appendChild(btn);
  });
}

function handleChoice(option){
  for(const k of Object.keys(option.scores)){
    scores[k] = (scores[k] || 0) + option.scores[k];
  }
  layers.push(STEPS[stepIndex].layerColor);

  if(stepIndex + 1 < STEPS.length){
    stepIndex++;
    renderQuestion();
  }else{
    done = true;
    renderResult();
  }
}

function renderResult(){
  const key = getResultKey(scores);
  const r = RESULTS[key];
  panel.innerHTML = `
    <div class="screen center">
      ${cakeHTML()}
      <div class="result-tag">你的蛋糕完成了</div>
      <div class="badge" style="background:linear-gradient(135deg, ${r.gradient[0]}, ${r.gradient[1]})">${r.emoji}</div>
      <h2 class="rtitle" style="color:${r.gradient[1]}">${r.title}</h2>
      <div class="rsubtitle">${r.subtitle}</div>
      <p class="rdesc">${r.desc}</p>
      <div class="block">
        <div class="block-title">📊 能力特質雷達圖</div>
        <div class="radar-wrap">${radarSVG(r.traits, r.gradient[1])}</div>
      </div>
      <div class="block">
        <div class="block-title">💪 你的強項</div>
        <ul class="strengths">${r.strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="block watch-box">
        <div class="block-title">🔍 提醒自己</div>
        <div class="watch-text">${r.watch}</div>
      </div>
      <div class="block">
        <div class="block-title">🎯 適合角色</div>
        <div class="roles-text">${r.roles}</div>
      </div>
      <div class="block compat-box">
        <div class="block-title">🤝 與他相處的建議</div>
        <div class="compat-text">${r.compat}</div>
      </div>
      <button class="btn-outline" id="restartBtn">再做一次</button>
    </div>`;
  document.getElementById('restartBtn').onclick = restart;
}

function restart(){
  stepIndex = -1;
  scores = initScores();
  layers = [];
  done = false;
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
